# Blueprint de Render. Con esto puedes desplegar en un clic desde el dashboard
# (New + → Blueprint → seleccionar este repo). Render te pedirá el valor de
# ANTHROPIC_API_KEY (no se guarda en el repo).
databases:
  # Base de datos compartida (opcional). Si la dejas, el equipo comparte el mismo
  # repositorio/competencia. El plan free de Render Postgres caduca a los ~30 días.
  - name: supplier-scout-db
    plan: free
services:
  - type: web
    name: supplier-scout-tipat
    runtime: node
    plan: free
    # --include=dev fuerza instalar Vite/Tailwind (devDependencies) para el build.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # Recomendado: define APP_PASSWORD para exigir login (HTTP Basic) en toda la app
      # y así proteger el proxy /api/anthropic de uso ajeno (que gastaría tu API key).
      # Opcional: APP_USER (usuario; por defecto "equipo").
      - key: APP_PASSWORD
        sync: false
      # Conecta automáticamente la base de datos de arriba (datos compartidos).
      - key: DATABASE_URL
        fromDatabase:
          name: supplier-scout-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
